[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-forecast-engine"
version = "0.1.0"
description = "Local forecasting engine for Home Assistant"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "astral==3.2",
    "fastapi==0.162.2",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "tzdata==2026.2",
    "psutil==7.2.2",
]

[project.optional-dependencies]
models = [
    "chronos-forecasting==2.3.2",
    "huggingface-hub==1.21.0",
    "safetensors==0.7.0",
    "numpy==2.4.4",
    "torch==2.10.0",
    "timestral @ https://github.com/mistralai/timestral/archive/a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff.tar.gz#sha256=be734f502f88e95b138558d765f3ad3b3ac8d2662270f9cf8b03138359828150",
]
test = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.15.6"]

[tool.setuptools.packages.find]
include = ["local_forecast_engine*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
