name: Engine CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: docker build --platform linux/${{ matrix.arch }} -t forecast-engine-ci .
      - name: Test pinned checkpoints on the native architecture
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          export LF_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --name forecast-engine-ci -p 127.0.0.1:18099:8099 -e LF_TOKEN forecast-engine-ci
          trap 'docker logs --tail 35 forecast-engine-ci; docker rm -f -v forecast-engine-ci' EXIT
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:18099/healthz >/dev/null && break
            sleep 2
          done
          python tests/smoke_container.py
