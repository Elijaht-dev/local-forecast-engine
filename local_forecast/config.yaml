name: Local Forecast Engine
version: "0.1.0"
slug: local_forecast
description: Run Timestral and Chronos-2 forecasts locally for Home Assistant.
url: https://github.com/Elijaht-dev/local-forecast-engine
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
discovery:
  - local_forecast
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Forecast engine API for a separate HA instance
options:
  retention_days: 90
  threads: 2
schema:
  retention_days: int(1,365)
  threads: int(1,8)
  api_token: password?
